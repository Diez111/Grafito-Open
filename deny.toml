# Supply-chain policy enforced by `cargo deny check` in CI.
# All currently resolved third-party crates originate from crates.io.

[graph]
all-features = true
no-default-features = false

[advisories]
version = 2
# The first four warnings require parent-library or framework migrations rather
# than a safe lockfile-only update. The final two entries are time-bounded
# vulnerability exceptions whose exact graph and expiry are enforced in CI.
# See `.github/SECURITY.md` for the complete reachability analysis.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "puffin 0.19.1 requires bincode 1.3.3; bincode 1.x has no maintained replacement and puffin 0.20 requires Rust 1.92." },
    { id = "RUSTSEC-2024-0436", reason = "simba 0.9.1 requires paste 1.0.15, the latest 1.x release; nalgebra 0.34 requires Rust 1.87, above the workspace MSRV 1.81." },
    { id = "RUSTSEC-2026-0192", reason = "eframe 0.29.1 pins owned_ttf_parser 0.25.1 and ttf-parser 0.25.1; remediation requires a coordinated eframe/wgpu framework migration." },
    { id = "RUSTSEC-2025-0165", reason = "geo 0.29.3 restricts i_overlay to <1.10, whose latest 1.9.4 requires i_tree ~0.8.3; geo 0.30 is a semver API migration requiring separate review." },
    { id = "RUSTSEC-2026-0194", reason = "Temporary through 2026-09-30; owner: Grafito maintainers. Affected attribute iteration is reached only when proc macros parse crate-shipped AT-SPI/Wayland XML at build time; zbus_xml 4 requires quick-xml ^0.30 and wayland-scanner 0.31.10 requires ^0.39, excluding fixed >=0.41. Remove on a compatible parent release or any reachability change; see .github/SECURITY.md." },
    { id = "RUSTSEC-2026-0195", reason = "Temporary through 2026-09-30; owner: Grafito maintainers. Neither reviewed consumer invokes NsReader (zbus_xml 4 deserialization and wayland-scanner use Reader), so the vulnerable namespace allocation is not reachable; the same parent constraints block fixed >=0.41. Remove on a compatible parent release or any reachability change; see .github/SECURITY.md." },
]

[bans]
multiple-versions = "warn"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "LicenseRef-UFL-1.0",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
