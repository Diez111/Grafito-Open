[package]
name = "grafito-release-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pruebas de humo de release a nivel workspace para Grafito"

[workspace]
members = ["crates/grafito-app", "crates/grafito-agent", "crates/grafito-anim", "crates/grafito-assistant", "crates/grafito-assistant-types", "crates/grafito-command", "crates/grafito-core", "crates/grafito-geometry", "crates/grafito-pedagogy", "crates/grafito-plugins", "crates/grafito-profile", "crates/grafito-render", "crates/grafito-ui", "crates/grafito-whiteboard", "crates/grafito-complex"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Grafito Contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Diez111/Grafito"
rust-version = "1.88"

[workspace.dependencies]
# Core
grafito-agent = { path = "crates/grafito-agent" }
grafito-anim = { path = "crates/grafito-anim" }
grafito-pedagogy = { path = "crates/grafito-pedagogy" }
grafito-plugins = { path = "crates/grafito-plugins" }
grafito-profile = { path = "crates/grafito-profile" }
grafito-core = { path = "crates/grafito-core" }
grafito-command = { path = "crates/grafito-command" }
grafito-geometry = { path = "crates/grafito-geometry" }
grafito-render = { path = "crates/grafito-render" }
grafito-ui = { path = "crates/grafito-ui" }
grafito-assistant = { path = "crates/grafito-assistant" }
grafito-assistant-types = { path = "crates/grafito-assistant-types" }
grafito-whiteboard = { path = "crates/grafito-whiteboard" }

# Window & GPU
eframe = "0.29"
wgpu = "22.0"
pollster = "0.3"
raw-window-handle = "0.6"

# UI
# `rayon` habilita tessellation paralela de egui (epaint/rayon). eframe 0.29
# NO expone feature `rayon` propia (verificado en registry 0.29.1); se activa
# en egui y cubre grafito-app + grafito-ui. Presupuesto: 1-2 ms/frame, 10K verts.
egui = { version = "0.29", features = ["rayon"] }

# Math & Geometry
glam = { version = "0.29", features = ["serde"] }
nalgebra = "0.33"
geo = "0.29"
geo-types = "0.7"
spade = "2.10"
robust = "1.1"

# Rendering
lyon = "1.0"
bytemuck = { version = "1.16", features = ["derive"] }

# Parsing & Expressions
evalexpr = "11.3"
num-complex = "0.4"

# Parallelism
rayon = "1.10"

# Spatial indexing
rstar = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

# Utilities
uuid = { version = "=1.20.0", features = ["v4", "serde"] }
thiserror = "1.0"
toml = "0.8"
gif = "0.13"
log = "0.4"
env_logger = "0.11"
# RUSTSEC-2026-0190 is fixed in 1.0.103; pin the minimum safe release.
anyhow = "=1.0.103"
rfd = "0.14"
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg"] }
once_cell = "1.19"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2.5"
keyring = { version = "3.6.2", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
warnings = "deny"
uninlined_format_args = "allow"
unwrap_used = "deny"
expect_used = "warn"
