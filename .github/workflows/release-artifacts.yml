name: release-artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-deb-rpm:
    name: Linux .deb + .rpm (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Instalar zip
        run: sudo apt-get update && sudo apt-get install -y zip
      - name: Instalar cargo-deb y cargo-generate-rpm
        run: cargo install cargo-deb cargo-generate-rpm --locked
      - name: Build release
        run: cargo build --release --locked -p grafito-app
      - name: Empaquetar .deb
        run: cargo deb -p grafito-app --no-build --no-strip
      - name: Empaquetar .rpm
        run: cargo generate-rpm -p grafito-app --auto-req no -o grafito.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb-rpm
          path: |
            target/debian/*.deb
            grafito.rpm

  windows:
    name: Windows x86_64 (.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Build release (MSVC)
        run: cargo build --release --locked -p grafito-app
      - name: Empaquetar zip
        run: Compress-Archive -Path target/release/grafito.exe -DestinationPath grafito-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: grafito-windows-x86_64.zip

  macos:
    name: macOS arm64 + x86_64 (.zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build release arm64 (nativo)
        run: cargo build --release --locked -p grafito-app --target aarch64-apple-darwin
      - name: Build release x86_64 (cross)
        run: cargo build --release --locked -p grafito-app --target x86_64-apple-darwin
      - name: Empaquetar zips
        run: |
          ditto -c -k --sequesterRsrc --keepParent target/aarch64-apple-darwin/release/grafito grafito-macos-arm64.zip
          ditto -c -k --sequesterRsrc --keepParent target/x86_64-apple-darwin/release/grafito grafito-macos-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-zips
          path: "grafito-macos-*.zip"

  release:
    name: Publicar release
    needs: [linux-deb-rpm, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
