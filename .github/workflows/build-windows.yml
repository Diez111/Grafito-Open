name: Build Windows Binary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1482605bfc5719782e1267fd0c0cc350fe7646b8
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab

      - name: Build release
        run: cargo build --release -p grafito-app --locked

      - name: Verify static MSVC runtime linkage
        shell: pwsh
        run: ./packaging/verify-msvc-runtime.ps1 -ExePath target/release/grafito.exe

      - name: Rename & Hash
        shell: pwsh
        run: |
          $exe = "target/release/grafito.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $name = "grafito-$(git describe --tags --always)-windows-x64.exe"
          Copy-Item $exe $name
          echo "sha256=$hash" >> $env:GITHUB_STEP_SUMMARY
          echo "artifact=$name" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: grafito-windows-x64
          path: grafito-*-windows-x64.exe
