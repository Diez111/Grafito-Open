[package]
name = "grafito-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "grafito"
path = "src/main.rs"

[lib]
name = "grafito_app"
path = "src/lib.rs"

[dependencies]
grafito-core.workspace = true
grafito-geometry.workspace = true
gif.workspace = true
grafito-agent.workspace = true
grafito-command.workspace = true
grafito-plugins.workspace = true
grafito-ui.workspace = true
grafito-render.workspace = true
grafito-assistant.workspace = true
grafito-assistant-types.workspace = true
grafito-complex = { path = "../grafito-complex" }

eframe = { workspace = true, features = ["wgpu"] }
pollster.workspace = true

egui.workspace = true
egui-wgpu = "0.29"
wgpu.workspace = true
bytemuck.workspace = true

glam.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
image.workspace = true
ab_glyph = "0.2.32"
tiny-skia = "0.11.4"
serde_json.workspace = true
grafito-anim.workspace = true
grafito-whiteboard.workspace = true
grafito-classroom.workspace = true
grafito-profile.workspace = true
grafito-pedagogy.workspace = true
serde.workspace = true
rayon.workspace = true
num-complex.workspace = true
rfd.workspace = true
uuid.workspace = true
keyring = { workspace = true, optional = true }
# F10-S: QR real escaneable del código de sala (qrcode 0.14 core, sin features
# de imagen/svg; sólo `QrCode::new` + `to_colors` para la grid egui).
qrcode = { workspace = true }
# W-D: portapapeles PNG OS (arboard directa; egui-winit ya la trae transitiva)
# + PDF vectorial (printpdf 0.12, antes solo workspace-dep sin cablear).
arboard = { workspace = true }
printpdf = { workspace = true }

# This maintained profiler pair establishes the workspace Rust 1.92 minimum.
puffin = { version = "=0.19.1", optional = true }
puffin_http = { version = "=0.16.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# E3: `assistant-net` (default ON) cablea `keyring` + `grafito-assistant/assistant-net`.
# `--no-default-features` compila sin red ni llavero: credenciales con stub
# honesto (`assistant_credentials`) y transporte con stub `NoNetwork`
# (`grafito-assistant`). Ahorro estimado: ~2.5-3.5 MiB (~8-9% de 37.4 MiB).
default = ["assistant-net"]
assistant-net = ["dep:keyring", "grafito-assistant/assistant-net"]
profile = ["puffin", "puffin_http", "eframe/puffin"]

[build-dependencies]
winresource = { version = "=0.1.31", default-features = false }

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Lautaro Agustin Diez <71948453+Diez111@users.noreply.github.com>"
copyright = "2026, Grafito Contributors (GPL-3.0-or-later)"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Calculadora gráfica matemática interactiva 3D con asistente.
Grafito es una calculadora gráfica matemática moderna y de alto
rendimiento escrita en Rust: graficación 2D y 3D, curvas paramétricas,
animaciones estilo Manim, asistente matemático con 21 herramientas,
CAS simbólico, planilla viva y cómputo GPU con fallback CPU."""
section = "graphics"
priority = "optional"
assets = [
    ["../../target/release/grafito", "usr/bin/", "755"],
    ["../../packaging/debian/grafito.desktop", "usr/share/applications/", "644"],
    ["../../assets/grafito-icon-16x16.png", "usr/share/icons/hicolor/16x16/apps/grafito.png", "644"],
    ["../../assets/grafito-icon-32x32.png", "usr/share/icons/hicolor/32x32/apps/grafito.png", "644"],
    ["../../assets/grafito-icon-48x48.png", "usr/share/icons/hicolor/48x48/apps/grafito.png", "644"],
    ["../../assets/grafito-icon-64x64.png", "usr/share/icons/hicolor/64x64/apps/grafito.png", "644"],
    ["../../assets/grafito-icon-128x128.png", "usr/share/icons/hicolor/128x128/apps/grafito.png", "644"],
    ["../../assets/grafito-icon-256x256.png", "usr/share/icons/hicolor/256x256/apps/grafito.png", "644"],
    ["../../assets/grafito-icon-512x512.png", "usr/share/icons/hicolor/512x512/apps/grafito.png", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "../../target/release/grafito", dest = "/usr/bin/grafito", mode = "755" },
    { source = "../../packaging/debian/grafito.desktop", dest = "/usr/share/applications/grafito.desktop", mode = "644" },
    { source = "../../assets/grafito-icon-256x256.png", dest = "/usr/share/icons/hicolor/256x256/apps/grafito.png", mode = "644" },
    { source = "../../assets/grafito-icon-512x512.png", dest = "/usr/share/icons/hicolor/512x512/apps/grafito.png", mode = "644" },
]
