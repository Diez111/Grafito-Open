[package]
name = "grafito-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "grafito"
path = "src/main.rs"

[lib]
name = "grafito_app"
path = "src/lib.rs"

[dependencies]
grafito-core.workspace = true
grafito-geometry.workspace = true
grafito-command.workspace = true
grafito-ui.workspace = true
grafito-render.workspace = true
grafito-assistant.workspace = true
grafito-assistant-types.workspace = true
grafito-complex = { path = "../grafito-complex" }

eframe = { workspace = true, features = ["wgpu"] }
pollster.workspace = true

egui.workspace = true
egui-wgpu = "0.29"
wgpu.workspace = true
bytemuck.workspace = true

glam.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
image.workspace = true
ab_glyph = "0.2.32"
tiny-skia = "0.11.4"
serde_json.workspace = true
serde.workspace = true
rayon.workspace = true
num-complex.workspace = true
rfd.workspace = true
keyring.workspace = true

# This maintained profiler pair establishes the workspace Rust 1.81 minimum.
puffin = { version = "=0.19.1", optional = true }
puffin_http = { version = "=0.16.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
profile = ["puffin", "puffin_http", "eframe/puffin"]

[build-dependencies]
winresource = { version = "=0.1.31", default-features = false }
