[package]
name = "grafito-assistant"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
alkahest-cas = { version = "3", optional = true }
base64.workspace = true
grafito-agent.workspace = true
grafito-anim.workspace = true
grafito-assistant-types.workspace = true
grafito-command.workspace = true
grafito-core.workspace = true
grafito-geometry.workspace = true
grafito-pedagogy.workspace = true
grafito-profile.workspace = true
image.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
url.workspace = true

[features]
# E3: transporte remoto opcional. Default ON para no romper el build
# existente; `--no-default-features` compila sólo resolución local con
# stubs honestos `NoNetwork` en `request_remote*` (ver lib.rs).
default = ["assistant-net"]
assistant-net = ["dep:reqwest"]
# F2: CAS experto opt-in (alkahest-cas 3: Expr hash-consed, UniPoly/MultiPoly,
# ArbBall, Gröbner F4, to_smtlib, export Lean4). VERIFICADO en el box 2026-09-10:
# su build.rs exige FLINT del sistema (>= 2.9, hard dep sin fallback pure-Rust;
# `flint3` sólo elige la API, no lo hace opcional) además de la C transitiva
# `gmp-mpfr-sys`/`rug`. Por eso es OPT-IN y no default: el build default sigue
# 100% Rust (sin C) con el fallback `grafito-geometry::symbolic::*_typed` +
# `grafito-core::symbolic::groebner_gate` (Buchberger acotado 2×2; F4 queda
# como stub honesto hasta cablear `GbPoly`). Para activarlo:
#   sudo apt-get install libflint-dev   (o FLINT_LIB_DIR/FLINT_INCLUDE_DIR)
#   cargo check -p grafito-assistant --features cas-nativo
# MSRV 1.92: el build default no compila ni enlaza C, sigue verde.
cas-nativo = ["dep:alkahest-cas"]

[dev-dependencies]
# F5: bench SSE-truncado informativo (sin gate). Misma version que grafito-geometry.
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sse_truncation"
harness = false

[lints]
workspace = true

