[package]
name = "grafito-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Servidor MCP stdio para el laboratorio Grafito: búsqueda verificable TOPP 39/57 sobre el motor puro"

[[bin]]
name = "grafito-mcp"
path = "src/main.rs"

[lib]
name = "grafito_mcp"
path = "src/lib.rs"

[dependencies]
grafito-agent.workspace = true
# assistant-net: el workspace lo trae con default-features=false (roto
# upstream sin el feature); la app lo reactiva igual. El MCP jamás llama a
# red (web_search excluido del proxy), solo necesita que compile el dispatcher.
grafito-assistant = { workspace = true, features = ["assistant-net"] }
grafito-command.workspace = true
grafito-core.workspace = true
grafito-geometry.workspace = true
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
wgpu.workspace = true

[lints]
workspace = true
